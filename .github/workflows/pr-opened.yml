name: Auto-Add PR to Project

on:
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    name: Add PR to Project
    # Dependabot-triggered runs get no Actions secrets, so PROJECT_PAT is empty and the step fails.
    # Checked on the PR author, not github.actor, so a human re-opening a bot PR still skips.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Send to Project Board
        uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        with:
          # REPLACE this with your actual GitHub Project URL
          project-url: https://github.com/users/aj1126/projects/1
          # This requires a custom secret, not the default GITHUB_TOKEN
          github-token: ${{ secrets.PROJECT_PAT }}