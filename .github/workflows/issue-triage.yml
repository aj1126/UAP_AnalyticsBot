name: Issue Triage Automation

on:
  issues:
    types: [opened]

# Reads milestones and sets one on the new issue; nothing else.
permissions:
  issues: write

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Automatically Assign to Active Milestone
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Fetches open milestones and assigns the newest issue to the first open milestone
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'due_on',
              direction: 'asc'
            });
            
            if (milestones.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                milestone: milestones.data[0].number
              });
            }