name: Create Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create GitHub release
        shell: pwsh
        run: |
          $releaseNotes = @"
          # UAPBot - Release $env:RELEASE_TAG
          "@
          $releaseNotes | Set-Content -Path release-notes.md
          Write-Host "Creating GitHub Release for tag $env:RELEASE_TAG..." -ForegroundColor Cyan
          gh release create "$env:RELEASE_TAG" `
            --title "Release $env:RELEASE_TAG" `
            --notes-file release-notes.md